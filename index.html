<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학원 행사·홍보 일정표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --ink:#1C2733; --muted:#5B6878; --line:#E2E6EB; --bg:#F3F5F8; --paper:#FFFFFF;
  --head:#D6E4F3; --head-ink:#14304F; --sun:#D63A3A; --sat:#1F5FD1; --accent:#1F5FD1;
  --staff:#8A5A00; --warn:#D63A3A; --soft:#EEF3F9; color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#E6EBF1; --muted:#9AA6B4; --line:#2B3440; --bg:#131820; --paper:#1A212B;
  --head:#22344A; --head-ink:#CFE0F3; --sun:#FF6B6B; --sat:#6FA3FF; --accent:#6FA3FF;
  --staff:#E3B35C; --warn:#FF6B6B; --soft:#202A36; color-scheme:dark;
}}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 상단 */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.brand{font-weight:800;font-size:18px;letter-spacing:-.02em;margin-right:auto}
button.brand{border:0;background:none;padding:2px 6px;margin-left:-6px;text-align:left;border-radius:8px;cursor:pointer;color:var(--ink);font-family:inherit}
button.brand:hover{background:var(--soft)}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;background:var(--soft);border-radius:8px;padding:3px}
.tabs button{border:0;background:none;padding:6px 14px;border-radius:6px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:1px solid var(--line);background:var(--paper);padding:7px 12px;border-radius:7px;font-weight:600}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.small{padding:3px 8px;font-size:12px}
.who{font-size:13px;color:var(--muted);border:0;background:none;text-decoration:underline dotted}
.status{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.status.ok::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#22A35A;margin-right:6px}
.status.demo{background:#FFF4C2;color:#5C4700}
.status.err{background:#FDE2E2;color:#9B1C1C}

main{padding:18px 20px 40px;max-width:1600px;margin:0 auto}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1100px){.layout{grid-template-columns:1fr}}

/* 달력 */
.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.monthbar h2{margin:0 8px;font-size:30px;font-weight:800;letter-spacing:-.03em;min-width:150px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.legend label{display:flex;align-items:center;gap:4px;font-size:12px;padding:3px 8px;border-radius:5px;cursor:pointer;user-select:none}
.legend input{margin:0}
.calwrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px}
.cal{min-width:820px;display:grid;grid-template-columns:62px repeat(7,minmax(0,1fr))}
.wk{display:contents}
.wklabel{background:var(--head);color:var(--head-ink);font-weight:700;font-size:13px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;border-bottom:1px solid var(--line)}
.day{min-height:120px;border-left:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;min-width:0;cursor:cell}
.day .dh{background:var(--head);color:var(--head-ink);font-weight:700;font-size:15px;padding:4px 8px;display:flex;justify-content:space-between;align-items:center}
.day.sun .dh{color:var(--sun)} .day.sat .dh{color:var(--sat)}
.day.out{opacity:.45}
.day.today{outline:2px solid #39FF14;outline-offset:-2px;position:relative;z-index:1}
.day.today .dh{box-shadow:inset 0 -3px 0 #39FF14}
.todaytag{font-size:11px;font-weight:800;background:#39FF14;color:#0B2A00;padding:0 6px;border-radius:4px}
.day.hol .dh{color:var(--sun)}
.dh .hn{font-size:11px;font-weight:700;color:var(--sun);margin-left:4px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dh .dn{flex:none}
.day .body{padding:4px;display:flex;flex-direction:column;gap:3px}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:3px;padding:2px 6px;font-size:12px;font-weight:700;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.cont{opacity:.75}
.staff{font-size:11.5px;color:var(--staff);font-weight:600;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk{display:flex;align-items:center;gap:4px;width:100%;text-align:left;border:1px dashed var(--line);background:var(--paper);border-radius:3px;padding:1px 5px;font-size:11.5px;color:var(--ink);white-space:nowrap;overflow:hidden}
.tk span.t{overflow:hidden;text-overflow:ellipsis}
.tk.done{opacity:.5;text-decoration:line-through}
.tk.late{border:1px solid var(--warn);color:var(--warn);font-weight:700}
.ch{flex:none;display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 3px;border-radius:3px;font-size:10.5px;font-weight:800;color:#fff}
.ch.blog{background:#03A94D}.ch.insta{background:#C13584}.ch.channel{background:#B89A00}.ch.sms{background:#2F6FDB}.ch.etc{background:#6B7685}.ch.alimtalk{background:#D4A300}.ch.hq{background:#6B4FD8}
/* 연월 선택 */
.ym{font-size:28px;font-weight:800;letter-spacing:-.03em;background:transparent;border:1px solid transparent;border-radius:8px;padding:0 6px;cursor:pointer;color:var(--ink)}
.ym:hover{border-color:var(--line);background:var(--soft)}
.ym option{font-size:15px;font-weight:500;background:var(--paper);color:var(--ink)}
.whosel{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 8px;font-weight:600;font-size:13px}
/* 사람 고르기 */
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:5px 12px;font-weight:600;font-size:13px}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pick .grp-t{width:100%;font-size:12px;font-weight:700;color:var(--muted);margin-top:6px}
.upick button{font-size:15px;padding:9px 16px}
/* 보기 필터 */
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px}
.fbar .chip{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:4px 10px;border-radius:6px;cursor:pointer;user-select:none;border:2px solid transparent}
.fbar .chip.off{opacity:.35;filter:grayscale(.6)}
.fbar .chip input{margin:0}
.fbar .sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.trow{display:grid;grid-template-columns:44px minmax(0,1fr) auto 70px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.trow input[type=color]{width:40px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:var(--paper)}
.trow input[type=text]{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;width:100%}
.trow .cnt{font-size:12px;color:var(--muted)}
.trow .np{font-size:12px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.trow .pv{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:700}

/* 행사 하이라이트 */
.cal .ev,.cal .tk,.cal .staff{transition:opacity .15s}
.cal.focus .ev,.cal.focus .tk,.cal.focus .staff{opacity:.15}
.cal.focus .hl{opacity:1 !important}
.cal.focus .ev.hl{box-shadow:0 0 0 2px #39FF14}
.cal.focus .tk.hl{border:1px solid #39FF14;color:var(--ink);text-decoration:none}
.cal.focus .tk.hl.done .t{text-decoration:line-through}
.cal.focus .day.hlday{background:rgba(57,255,20,.07)}
.tk .dd{display:none;flex:none;font-size:10.5px;font-weight:800;background:#39FF14;color:#0B2A00;border-radius:3px;padding:0 4px}
.cal.focus .tk.hl .dd{display:inline-block}
.todo[data-hev]:hover{background:var(--soft)}
@media (prefers-reduced-motion:reduce){.cal .ev,.cal .tk,.cal .staff{transition:none}}
/* 이달의 행사 */
.evitem{display:grid;grid-template-columns:6px 58px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid transparent;background:none;padding:8px 6px;border-radius:8px;margin-bottom:2px}
.evitem:hover{background:var(--soft)}
.evitem[aria-pressed="true"]{border-color:#39FF14;background:var(--soft)}
.evitem .cb{align-self:stretch;border-radius:3px}
.evitem .d{font-weight:800;font-size:13px;white-space:nowrap}
.evitem .d small{font-weight:500;color:var(--muted)}
.evitem .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evitem .nm small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.evitem .pg{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.evitem .pg.late{color:var(--warn)}
.evitem .pg.ok{color:#22A35A}
.evdetail{border-left:2px solid #39FF14;margin:2px 0 10px 8px;padding:2px 0 4px 10px}
.evdetail .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(57,255,20,.1);border:1px solid #39FF14;border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:13px}
.selbar b{font-weight:800}
/* 연간 */
.yhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.yhead .hint{font-size:12px;color:var(--muted)}
.yr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:1180px){.yr{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.yr{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.yr{grid-template-columns:1fr}}
.mm{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mm .mt{display:block;width:100%;border:0;cursor:default;padding:7px;font-weight:800;font-size:16px;background:var(--head);color:var(--head-ink);text-align:center}
.mm.prev .mt{background:#FFF1C9;color:#5C4700}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .mm.prev .mt{background:#3B3420;color:#F3DFA2}}

.mm table{width:100%;border-collapse:collapse;table-layout:fixed}
.mm th{font-size:12px;font-weight:800;padding:4px 0;color:var(--muted)}
.mm th:first-child{color:var(--sun)} .mm th:last-child{color:var(--sat)}
.mm td{padding:2px}
.mm td button{display:block;width:100%;height:28px;border:0;border-radius:4px;background:none;font-weight:700;font-size:13.5px;color:var(--ink);padding:0}
.mm td button:hover{outline:1px solid var(--line)}
.mm td.su button,.mm td.ho button{color:var(--sun)} .mm td.sa button{color:var(--sat)}
.mm td.mk button{background:var(--mk);color:var(--mkink) !important}
.mm td.etc button{position:relative}
.mm td.etc button::after{content:"";position:absolute;right:3px;top:3px;width:5px;height:5px;border-radius:50%;background:currentColor}
.mm .notes .mkl i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.ynote{display:block;width:100%;margin-top:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 7px;font-size:12px;resize:vertical;min-height:30px;font-family:inherit}
.ylegend{display:flex;flex-wrap:wrap;gap:6px}
.ylegend span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px}
.kpick{display:grid;gap:8px}
.kpick button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid transparent;border-radius:8px;padding:10px 12px;font-weight:800;font-size:15px}
.kpick button[aria-pressed="true"]{border-color:var(--ink)}
.mm td.td button{outline:2px solid #39FF14;outline-offset:-1px}
.mm .notes{padding:6px 10px 9px;font-size:11.5px;line-height:1.6;border-top:1px solid var(--line);min-height:30px}
.mm .notes .h{color:var(--sun);font-weight:600}
.mm .notes .e i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:0}
@media print{
  .top,.fbar #editTypes,.fbar #editStaff,.fbar .whosel,#banner,.yhead button,.yhead .hint,.toast{display:none!important}
  body{background:#fff;color:#000} main{padding:0;max-width:none}
  .yr{grid-template-columns:repeat(4,1fr);gap:8px} .mm{break-inside:avoid;border-color:#bbb}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* 사이드 */
.side{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;position:sticky;top:84px}
.side h3{margin:0 0 4px;font-size:15px}
.side p.sub{margin:0 0 10px;color:var(--muted);font-size:12px}
.grp{font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.grp.late{color:var(--warn)}

/* 할 일 항목 */
.todo{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:start;padding:7px 4px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}
.todo input[type=checkbox]{margin-top:3px;width:16px;height:16px}
.todo .ti{font-weight:600;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.todo .meta{grid-column:2/4;font-size:12px;color:var(--muted)}
.todo .when{font-size:12px;font-weight:700;white-space:nowrap}
.todo.late .when{color:var(--warn)}
.todo.done .ti{text-decoration:line-through;opacity:.55}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;background:var(--soft);color:var(--muted)}
.linkish{border:0;background:none;padding:0;color:var(--accent);font-size:12px;text-decoration:underline}

/* 목록 */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.filters input[type=search],.filters select{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 10px}
.filters input[type=search]{min-width:220px}
.list{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row summary{list-style:none;display:grid;grid-template-columns:92px 86px minmax(0,1fr) 140px 120px;gap:12px;align-items:center;padding:11px 14px;cursor:pointer}
.row summary::-webkit-details-marker{display:none}
.row[open] summary{background:var(--soft)}
.row .d{font-weight:800;font-size:15px}
.row .d small{font-weight:500;color:var(--muted);font-size:12px;margin-left:3px}
.badge{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:4px;text-align:center}
.row .tt{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tt small{display:block;font-weight:500;color:var(--staff);font-size:12px}
.prog{font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:#22A35A}
.bar.late i{background:var(--warn)}
.rowbody{padding:6px 14px 14px 118px}
.rowbody .acts{display:flex;gap:8px;margin-top:8px}
@media (max-width:760px){
  .row summary{grid-template-columns:70px 1fr;gap:4px 10px}
  .row summary .badge{justify-self:start}
  .row summary > :nth-child(n+3){grid-column:1/3}
  .rowbody{padding:6px 14px 14px}
}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.todoview{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.todoview section{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.todoview h3{margin:0 0 6px;font-size:15px}
.todoview h3.late{color:var(--warn)}

/* 편집 창 */
dialog{border:0;border-radius:12px;padding:0;width:min(980px,96vw);max-height:92vh;background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,23,35,.45)}
.dlg{display:flex;flex-direction:column;max-height:92vh}
.dlg header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.dlg header h2{margin:0;font-size:18px;margin-right:auto}
.dlg .scroll{overflow:auto;padding:16px 20px}
.dlg footer{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dlg footer .info{margin-right:auto;font-size:12px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
@media (max-width:700px){.fgrid{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.w2{grid-column:span 2}.f.w4{grid-column:1/-1}
.f > span{font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.f textarea{resize:vertical;min-height:38px}
.typepick{display:flex;flex-wrap:wrap;gap:6px}
.typepick label{cursor:pointer}
.typepick input{position:absolute;opacity:0;pointer-events:none}
.typepick span{display:inline-block;padding:5px 11px;border-radius:5px;font-weight:700;font-size:13px;border:2px solid transparent}
.typepick input:checked + span{border-color:var(--ink)}
.typepick input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.tasksec{margin-top:20px}
.tasksec .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tasksec .h h3{margin:0;font-size:15px;margin-right:auto}
.tasksec .hint{font-size:12px;color:var(--muted);margin:0 0 10px}
.tcard{border:1px solid var(--line);border-left:4px solid #6B7685;border-radius:8px;padding:10px;margin-bottom:8px;display:grid;grid-template-columns:auto 118px minmax(0,1.6fr) 150px 128px 100px minmax(0,.8fr) minmax(0,.8fr) auto;gap:8px;align-items:end}
.tcard.blog{border-left-color:#03A94D}.tcard.insta{border-left-color:#C13584}.tcard.channel{border-left-color:#B89A00}.tcard.sms{border-left-color:#2F6FDB}.tcard.alimtalk{border-left-color:#D4A300}.tcard.hq{border-left-color:#6B4FD8}
.tcard.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{background:#FFF4C2}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){.tcard.flash{animation:none;background:#FFF4C2}}
.tcard .done{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tcard .done input{width:18px;height:18px}
.tcard .content{grid-column:2/-1}
.tcard .content textarea{min-height:34px}
.tcard .dday{font-size:11px;color:var(--muted);font-weight:600}
@media (max-width:900px){.tcard{grid-template-columns:auto 1fr 1fr}.tcard .content{grid-column:1/-1}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1C2733;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.banner{background:#FFF4C2;color:#5C4700;padding:10px 20px;font-size:13px}
.banner.err{background:#FDE2E2;color:#9B1C1C}
</style>
</head>
<body>

<div class="top">

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const todayStr = () => ymd(new Date());
const md = s => { const d = parse(s); return `${d.getMonth()+1}/${d.getDate()}`; };

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2600); }
function lsGet(k,def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v);}catch{ return def; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }

function inkFor(hex){
  const h=(hex||"#cccccc").replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150 ? "#1F2A37" : "#FFFFFF";
}
function typeOf(key){
  const t=state.types.find(x=>x.key===key);

}

/* ---------- 저장소 ---------- */

function makeLocalStore(){
  const KEY="academy-schedule-demo";
  let subs=[];
  const read=()=>lsGet(KEY,null);
  const write=arr=>{ lsSet(KEY,arr); subs.forEach(cb=>cb(clone(arr))); };
  if(!read()) lsSet(KEY, seed());
  window.addEventListener("storage",e=>{ if(e.key===KEY) subs.forEach(cb=>cb(read()||[])); });
  return {
    subscribe(cb){ subs.push(cb); cb(read()||[]); },
    async save(ev){ const arr=read()||[]; const i=arr.findIndex(x=>x.id===ev.id); if(i>=0) arr[i]=ev; else arr.push(ev); write(arr); },
    async remove(id){ write((read()||[]).filter(x=>x.id!==id)); }
  };
}

async function makeFirebaseStore(){
  const V="10.12.2";
  const {initializeApp} = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const au = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const app = initializeApp(firebaseConfig);
  await au.signInAnonymously(au.getAuth(app));
  const db = fs.initializeFirestore(app,{ignoreUndefinedProperties:true});
  const col = fs.collection(db,COLLECTION);
  return {
    subscribe(cb,onErr){ fs.onSnapshot(col, snap=>cb(snap.docs.map(d=>({...d.data(), id:d.id}))), onErr); },
    save(ev){ const {id,...data}=ev; return fs.setDoc(fs.doc(db,COLLECTION,id), data); },
    remove(id){ return fs.deleteDoc(fs.doc(db,COLLECTION,id)); }
  };
}

function allTasks(){
  const out=[];
  for(const ev of state.events) if(visible(ev)) for(const t of (ev.tasks||[])) out.push({t,ev});
  return out.sort((a,b)=>(a.t.date+a.t.time).localeCompare(b.t.date+b.t.time));
}
const isLate = t => !t.done && t.date < todayStr();
function evDays(ev){
  const days=[ev.date];
  if(ev.endDate && ev.endDate>ev.date){ let d=ev.date, n=0; while(d<ev.endDate && n<60){ d=addDays(d,1); days.push(d); n++; } }
  return days;
}

/* ---------- 연간 달력 (월 일정과 별개) ---------- */
const YKINDS = {
  off:{name:"휴무",            color:"#2BD94A", ink:"#082E0E"},
  q2: {name:"2개월 분기 개강일", color:"#2EE6E6", ink:"#003838"},
  q3: {name:"3개월 분기 개강일", color:"#A855F7", ink:"#FFFFFF"},
  etc:{name:"기타",            color:"#FFB648", ink:"#3A2400"},
};
const ymId = (y,m) => `_ym_${y}-${pad(m+1)}`;
const ymDoc = (y,m) => state.ym[ymId(y,m)];
function yearHTML(){
  const Y=state.yy, cy=new Date().getFullYear(), T=todayStr();
  const ys=[]; for(let k=Math.min(cy-1,Y);k<=Math.max(cy+2,Y);k++) ys.push(k);
  const months=[...[8,9,10,11].map(m=>[Y-1,m]), ...Array.from({length:12},(_,m)=>[Y,m])];
  const cnt={off:0,q2:0,q3:0,etc:0};
  const noData = !Object.keys(HOLIDAYS).some(k=>k.startsWith(Y+"-"));
  const mmHTML=([y,m])=>{
    const first=new Date(y,m,1).getDay(), n=new Date(y,m+1,0).getDate();
    const doc=ymDoc(y,m)||{}, marks=doc.marks||{};
    let cells="";
    for(let i=0;i<first;i++) cells+="<td></td>";
    for(let d=1; d<=n; d++){
      const s=`${y}-${pad(m+1)}-${pad(d)}`, wd=(first+d-1)%7, hol=HOLIDAYS[s], mk=marks[d], K=mk&&YKINDS[mk.k];
      const cls=[]; if(wd===0)cls.push("su"); if(wd===6)cls.push("sa"); if(hol)cls.push("ho"); if(s===T)cls.push("td");
      let style="";
      if(K){ cls.push("mk"); if(mk.k==="etc") cls.push("etc"); style=` style="--mk:${K.color};--mkink:${K.ink}"`; cnt[mk.k]++; }
      const tip=[hol, K?(K.name+(mk.memo?`: ${mk.memo}`:"")):""].filter(Boolean).join("\n");
      cells+=`<td class="${cls.join(" ")}"${style}><button type="button" data-ymark="${s}" title="${esc(tip||"클릭해서 표시하기")}">${d}</button></td>`;
      if(wd===6 && d<n) cells+="</tr><tr>";
    }
    /* 공휴일 메모 */
    const notesH=[]; const hs=Object.keys(HOLIDAYS).filter(k=>k.startsWith(`${y}-${pad(m+1)}-`)).sort();
    for(let i=0;i<hs.length;i++){
      let j=i; while(j+1<hs.length && HOLIDAYS[hs[j+1]]===HOLIDAYS[hs[i]] && diff(hs[j],hs[j+1])===1) j++;
      notesH.push(`${parse(hs[i]).getDate()}(${dow(hs[i])})${j>i?`~${parse(hs[j]).getDate()}(${dow(hs[j])})`:""} ${HOLIDAYS[hs[i]]}`); i=j;
    }
    /* 표시 메모 (연속된 같은 표시는 묶기) */
    const days=Object.keys(marks).map(Number).filter(d=>YKINDS[marks[d]?.k]).sort((a,b)=>a-b);
    const notesM=[];
    for(let i=0;i<days.length;i++){
      const k=marks[days[i]].k; let j=i;
      if(k!=="etc") while(j+1<days.length && days[j+1]===days[j]+1 && marks[days[j+1]].k===k) j++;
      const ds=d=>`${d}(${DOW[new Date(y,m,d).getDay()]})`;
      const label = k==="etc" ? (marks[days[i]].memo||"기타") : YKINDS[k].name;
      notesM.push(`<div class="mkl"><i style="background:${YKINDS[k].color}"></i>${ds(days[i])}${j>i?`~${ds(days[j])}`:""} ${esc(label)}</div>`); i=j;
    }
    const key=`${y}-${pad(m+1)}`;
    return `<div class="mm${y<Y?" prev":""}"><div class="mt">${y}년 ${m+1}월</div>
      <table><thead><tr>${[..."일월화수목금토"].map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody><tr>${cells}</tr></tbody></table>
      <div class="notes">${notesH.length?`<div class="h">${notesH.join(" / ")}</div>`:""}${notesM.join("")}
        <textarea class="ynote" data-ynote="${key}" rows="1" placeholder="${m+1}월 메모" aria-label="${y}년 ${m+1}월 메모">${esc(doc.note||"")}</textarea></div></div>`;
  };
  const body=months.map(mmHTML).join("");
  return `<div class="yhead">
    <select class="ym" id="yySel" aria-label="연도">${ys.map(k=>`<option value="${k}" ${k===Y?"selected":""}>${k}년</option>`).join("")}</select>
    <div class="ylegend">${Object.entries(YKINDS).map(([k,K])=>`<span style="background:${K.color};color:${K.ink}">${K.name} ${cnt[k]}</span>`).join("")}</div>
    <span class="hint">날짜를 누르면 표시를 고를 수 있어요.${noData?` · ${Y}년 공휴일 정보는 아직 없습니다.`:""}</span>
    <button type="button" class="btn small" id="printBtn" style="margin-left:auto">인쇄</button>
  </div><div class="yr">${body}</div>`;
}
async function saveYm(y,m,fn){
  const id=ymId(y,m), doc=clone(ymDoc(y,m)||{id, marks:{}, note:""});
  doc.marks ||= {}; fn(doc); doc.id=id; doc.updatedBy=state.user||"이름없음"; doc.updatedAt=Date.now();
  try{ await store.save(doc); return true; }catch(err){ toast("저장하지 못했습니다: "+err.message); return false; }
}

function openYMark(s){
  const d=parse(s), cur=(ymDoc(d.getFullYear(),d.getMonth())?.marks||{})[d.getDate()];
  ydraft={s, k:cur?.k||"", memo:cur?.memo||""};
  drawYMark(); $("#ydlg").showModal();
}
function drawYMark(){
  const d=parse(ydraft.s), hol=HOLIDAYS[ydraft.s];
  $("#yForm").innerHTML=`<header><h2>${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${dow(ydraft.s)})</h2><button type="button" class="btn" data-yclose>닫기</button></header>
  <div class="scroll">
    ${hol?`<p style="margin:0 0 10px;color:var(--sun);font-weight:700;font-size:13px">${hol}</p>`:""}
    <div class="kpick">${Object.entries(YKINDS).map(([k,K])=>`<button type="button" data-yk="${k}" aria-pressed="${ydraft.k===k}" style="background:${K.color};color:${K.ink}">${K.name}</button>`).join("")}</div>
    ${ydraft.k==="etc"?`<label class="f" style="margin-top:12px"><span>메모</span><input id="yMemo" value="${esc(ydraft.memo)}" placeholder="예: 정상수업, 3월 근무자 급여처리"></label>`:""}
  </div>
  <footer><span class="info"></span>
    ${(ymDoc(d.getFullYear(),d.getMonth())?.marks||{})[d.getDate()]?`<button type="button" class="btn danger" id="yClear">표시 지우기</button>`:""}
    <button type="button" class="btn" data-yclose>취소</button>
    ${ydraft.k==="etc"?`<button type="button" class="btn primary" id="ySave">저장</button>`:""}
  </footer>`;
  if(ydraft.k==="etc") setTimeout(()=>$("#yMemo")?.focus(),0);
}
async function commitYMark(k,memo){
  const d=parse(ydraft.s);
  const ok=await saveYm(d.getFullYear(),d.getMonth(),doc=>{ if(k) doc.marks[d.getDate()]={k,memo:k==="etc"?(memo||""):""}; else delete doc.marks[d.getDate()]; });
  if(ok) $("#ydlg").close();
}
$("#yForm").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-yclose")){ $("#ydlg").close(); return; }
  if(b.dataset.yk){ const k=b.dataset.yk; if(k==="etc"){ ydraft.k="etc"; drawYMark(); } else commitYMark(k); return; }
  if(b.id==="yClear"){ commitYMark(""); return; }
  if(b.id==="ySave"){ commitYMark("etc", $("#yMemo").value.trim()); }
});
$("#yForm").addEventListener("keydown",e=>{ if(e.key==="Enter" && e.target.id==="yMemo"){ e.preventDefault(); commitYMark("etc", e.target.value.trim()); } });

function selBarHTML(ev,y,m){
  const f=new Date(y,m,1), l=new Date(y,m+1,0);
  const p0=ymd(new Date(y,m,1-f.getDay())), p1=ymd(new Date(y,m,l.getDate()+(6-l.getDay())));
  const ts=ev.tasks||[]; const before=ts.filter(t=>t.date<p0).length, after=ts.filter(t=>t.date>p1).length;
  const evIn = ev.date<=p1 && (ev.endDate||ev.date)>=p0;
  const notes=[ before?`<button type="button" class="linkish" data-nav="-1">이전 달에 홍보 ${before}개</button>`:"",
    after?`<button type="button" class="linkish" data-nav="1">다음 달에 홍보 ${after}개</button>`:"",
    !evIn?`<button type="button" class="linkish" data-goto="${ev.date}">행사일(${md(ev.date)})로 이동</button>`:"" ].filter(Boolean).join(" · ");
  return `<div class="selbar"><span>선택한 행사만 보는 중: <b>${esc(ev.title)}</b> (${md(ev.date)})</span>${notes?`<span>${notes}</span>`:""}
    <button type="button" class="btn small" id="clearSel" style="margin-left:auto">전체 일정 보기</button></div>`;
}
function ymSelects(y,m){
  const cy=new Date().getFullYear(); const ys=[];
  for(let k=Math.min(cy-1,y);k<=Math.max(cy+3,y);k++) ys.push(k);
  return `<select class="ym" id="ySel" aria-label="연도">${ys.map(k=>`<option value="${k}" ${k===y?"selected":""}>${k}년</option>`).join("")}</select>
    <select class="ym" id="mSel" aria-label="월">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===m?"selected":""}>${i+1}월</option>`).join("")}</select>`;
}
function chipEv(ev, cont){
  const ty=typeOf(ev.type);
  const label=`${!cont && ev.time?ev.time+" ":""}${ev.title}`;
  return `<button type="button" class="ev${cont?" cont":""}" data-ev="${ev.id}" style="background:${ty.color};color:${ty.ink}" title="${esc(ty.name+" · "+ev.title)}">${esc(label)}</button>`
    + (!cont && (ev.staff||ev.place) ? `<div class="staff" title="${esc([ev.place,ev.staff].filter(Boolean).join(" / "))}">${esc([ev.place,ev.staff].filter(Boolean).join(" · "))}</div>`:"");
}
function chipTask({t,ev}){
  const cls=["tk"]; if(t.done) cls.push("done"); else if(isLate(t)) cls.push("late");
  const aud=t.audience?`·${t.audience}`:"";
  const n=diff(t.date,ev.date); const dd=n>0?`D-${n}`:n===0?"당일":`D+${-n}`;
  return `<button type="button" class="${cls.join(" ")}" data-ev="${ev.id}" data-task="${t.id}" title="${esc(`${CHANNELS[t.channel]?.name||""} ${t.label}${aud} ${t.time} — ${ev.title}`)}"><span class="ch ${t.channel}">${CHANNELS[t.channel]?.short||"•"}</span><span class="dd">${dd}</span><span class="t">${esc(t.label+aud)} · ${esc(ev.title)}</span></button>`;
}

function calHTML(){
  const {y,m}=state;
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const start=new Date(y,m,1-first.getDay());
  const end=new Date(y,m,last.getDate()+(6-last.getDay()));
  const map={};
  const put=(d,k,v)=>{ (map[d] ||= {ev:[],tk:[]})[k].push(v); };
  const offDays=new Set();
  for(const ev of state.events){
    if(typeOf(ev.type).name.includes("휴무")) evDays(ev).forEach(d=>offDays.add(d));
    if(state.sel ? ev.id!==state.sel : !visible(ev)) continue; evDays(ev).forEach((d,i)=>put(d,"ev",{ev,cont:i>0}));
  }
  const selEv = state.sel && state.events.find(e=>e.id===state.sel);
  if(selEv){ for(const t of (selEv.tasks||[])) put(t.date,"tk",{t,ev:selEv}); }
  else if(state.showTasks) for(const x of filterMine(allTasks())) put(x.t.date,"tk",x);
  const T=todayStr();
  let html=`<div class="monthbar">
    <button class="btn" data-nav="-1" aria-label="이전 달">‹</button>
    ${ymSelects(y,m)}
    <button class="btn" data-nav="1" aria-label="다음 달">›</button>
    <button class="btn" data-nav="0">이번 달</button>
</div>${selEv?selBarHTML(selEv,y,m):""}<div class="calwrap"><div class="cal">`;
  let d=new Date(start), wk=0;
  while(d<=end){
    wk++;
    html+=`<div class="wk"><div class="wklabel">${wk}주차</div>`;
    for(let i=0;i<7;i++){
      const s=ymd(d), cell=map[s]||{ev:[],tk:[]};
      const hol=HOLIDAYS[s];
      const cls=["day"]; if(i===0)cls.push("sun"); if(i===6)cls.push("sat"); if(hol||offDays.has(s))cls.push("hol"); if(d.getMonth()!==m)cls.push("out"); if(s===T)cls.push("today");
      html+=`<div class="${cls.join(" ")}" data-day="${s}"><div class="dh"><span class="dn">${d.getMonth()+1}/${d.getDate()}</span>${hol?`<span class="hn">${hol}</span>`:""}${s===T?`<span class="todaytag">오늘</span>`:""}</div><div class="body">
        ${cell.ev.map(x=>chipEv(x.ev,x.cont)).join("")}${cell.tk.map(chipTask).join("")}</div></div>`;
      d.setDate(d.getDate()+1);
    }
    html+=`</div>`;
  }
  return html+`</div></div>`;
}

function todoItem({t,ev}){
  const T=todayStr(); const dd=diff(T,t.date);
  const when = t.done ? "완료" : dd<0 ? `${-dd}일 지남` : dd===0 ? "오늘" : `D-${dd}`;
  const cls=["todo"]; if(t.done)cls.push("done"); else if(isLate(t))cls.push("late");
  const meta=[`${md(t.date)}(${dow(t.date)}) ${t.time||""}`, t.audience, t.grades, t.assignee?`담당 ${t.assignee}`:"", t.done&&t.doneBy?`✓ ${t.doneBy}`:""].filter(Boolean).join(" · ");
  return `<div class="${cls.join(" ")}" data-hev="${ev.id}">
    <input type="checkbox" data-toggle="${ev.id}|${t.id}" ${t.done?"checked":""} aria-label="${esc(t.label)} 완료">
    <div class="ti"><span class="ch ${t.channel}">${CHANNELS[t.channel]?.short||"•"}</span>${esc(t.label)} <span class="tag">${esc(ev.title)}</span></div>
    <span class="when">${when}</span>
    <div class="meta">${esc(meta)}
      ${t.content?` · <button type="button" class="linkish" data-copy="${ev.id}|${t.id}">문구 복사</button>`:""}
      · <button type="button" class="linkish" data-ev="${ev.id}" data-task="${t.id}">열기</button></div>
  </div>`;
}
function filterMine(arr){ return state.who ? arr.filter(x=>(x.t.assignee||"")===state.who) : arr; }

function monthEvents(){
  const p0=`${state.y}-${pad(state.m+1)}-01`, p1=ymd(new Date(state.y,state.m+1,0));
  return state.events.filter(e=>visible(e) && e.date<=p1 && (e.endDate||e.date)>=p0)
    .sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
}
function evItemHTML(ev){
  const ty=typeOf(ev.type), ts=ev.tasks||[], done=ts.filter(t=>t.done).length, late=ts.some(isLate);
  const sel=state.sel===ev.id;
  const pg = !ts.length ? "" : late ? `<span class="pg late">지연 ${done}/${ts.length}</span>` : done===ts.length ? `<span class="pg ok">완료 ${done}/${ts.length}</span>` : `<span class="pg">${done}/${ts.length}</span>`;
  let html=`<button type="button" class="evitem" data-sel="${ev.id}" data-hev="${ev.id}" aria-pressed="${sel}">
    <span class="cb" style="background:${ty.color}"></span>
    <span class="d">${md(ev.date)}<small>(${dow(ev.date)})</small></span>
    <span class="nm">${esc(ev.title)}<small>${esc([ty.name, ev.time, ev.staff].filter(Boolean).join(" · "))}</small></span>
    ${pg}</button>`;
  if(sel){
    const list=sortTasks([...ts]).map(t=>({t,ev}));
    html+=`<div class="evdetail">
      ${list.length?list.map(todoItem).join(""):`<p class="sub" style="margin:4px 0">등록된 홍보 일정이 없습니다.</p>`}
      <div class="acts"><button type="button" class="btn small" data-ev="${ev.id}">행사 수정</button><button type="button" class="btn small" id="clearSel">전체 일정 보기</button></div>
    </div>`;
  }
  return html;
}
function sideHTML(){
  const evs=monthEvents();
  const selEv=state.sel && state.events.find(e=>e.id===state.sel);
  const extra = selEv && !evs.some(e=>e.id===selEv.id) ? `<div class="grp">선택한 행사</div>${evItemHTML(selEv)}<div class="grp">${state.m+1}월 행사</div>` : "";
  return `<aside class="side"><h3>${state.y}년 ${state.m+1}월 행사 <span class="tag">${evs.length}</span></h3>
    <p class="sub">행사를 고르면 달력에 그 행사와 홍보 일정만 보입니다. 다시 누르면 전체 보기로 돌아가요.</p>
    ${extra}
    ${evs.length?evs.map(evItemHTML).join(""):`<p class="sub">이 달에 등록된 행사가 없습니다.</p>`}
  </aside>`;
}

function listHTML(){
  const T=todayStr(); const q=state.q.trim().toLowerCase();
  let evs=[...state.events].sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  evs=evs.filter(visible);
  if(state.period==="upcoming") evs=evs.filter(e=>(e.endDate||e.date)>=T);
  if(state.period==="past") evs=evs.filter(e=>(e.endDate||e.date)<T).reverse();
  if(state.period==="month"){ const p=`${state.y}-${pad(state.m+1)}`; evs=evs.filter(e=>e.date.startsWith(p)); }
  if(q) evs=evs.filter(e=>[e.title,e.staff,e.place,e.grades,e.memo].join(" ").toLowerCase().includes(q));
  const rows=evs.map(ev=>{
    const ty=typeOf(ev.type), ts=sortTasks([...(ev.tasks||[])]);
    const done=ts.filter(t=>t.done).length, late=ts.some(isLate);
    const pct=ts.length?Math.round(done/ts.length*100):0;
    return `<details class="row"><summary>
      <span class="d">${md(ev.date)}<small>(${dow(ev.date)})</small></span>
      <span class="badge" style="background:${ty.color};color:${ty.ink}">${ty.name}</span>
      <span class="tt">${esc(ev.title)}${ev.endDate?` ~ ${md(ev.endDate)}`:""}<small>${esc([ev.time,ev.place,ev.staff,ev.grades].filter(Boolean).join(" · "))}</small></span>
      <span class="prog">홍보 ${done}/${ts.length}${late?` <b style="color:var(--warn)">· 지연 있음</b>`:""}<div class="bar${late?" late":""}"><i style="width:${pct}%"></i></div></span>
      <span class="prog">${ev.updatedBy?`수정: ${esc(ev.updatedBy)}`:""}</span>
    </summary><div class="rowbody">
      ${ts.length?ts.map(t=>todoItem({t,ev})).join(""):`<p class="sub" style="color:var(--muted)">등록된 홍보 할 일이 없습니다.</p>`}
      ${ev.memo?`<p style="white-space:pre-wrap;color:var(--muted);font-size:13px">${esc(ev.memo)}</p>`:""}
      <div class="acts"><button class="btn small" data-ev="${ev.id}">행사 수정</button></div>
    </div></details>`;
  }).join("");
  return `<div class="filters">
    <input type="search" id="q" placeholder="행사명, 담당자, 장소 검색" value="${esc(state.q)}">
    <select id="period">
      <option value="upcoming" ${state.period==="upcoming"?"selected":""}>다가오는 행사</option>
      <option value="month" ${state.period==="month"?"selected":""}>${state.y}년 ${state.m+1}월</option>
      <option value="past" ${state.period==="past"?"selected":""}>지난 행사</option>
      <option value="all" ${state.period==="all"?"selected":""}>전체</option>
    </select>
    <span style="color:var(--muted);font-size:13px">${evs.length}건</span>
  </div>
  <div class="list">${rows||`<div class="empty">조건에 맞는 행사가 없습니다. 위에서 ‘+ 행사 추가’로 등록해 보세요.</div>`}</div>`;
}

function todoViewHTML(){
  const T=todayStr(), wk=addDays(T,7);
  const ts=filterMine(allTasks());
  const groups=[
    ["지났는데 안 끝난 일", ts.filter(x=>!x.t.done && x.t.date<T), true],
    ["오늘", ts.filter(x=>x.t.date===T), false],
    ["이번 주(내일~7일)", ts.filter(x=>x.t.date>T && x.t.date<=wk), false],
    ["그 이후", ts.filter(x=>x.t.date>wk && !x.t.done), false],
  ];
  return `<div class="todoview">${groups.map(([h,arr,late])=>`<section><h3 class="${late&&arr.length?"late":""}">${h} <span class="tag">${arr.length}</span></h3>
    ${arr.length?arr.slice(0,60).map(todoItem).join(""):`<p style="color:var(--muted);font-size:13px">없음</p>`}</section>`).join("")}</div>`;
}

/* ---------- 편집 창 ---------- */
function openEditor(id, date, focusTask){
  autoFilled=false;
  if(id){ const ev=state.events.find(e=>e.id===id); if(!ev) return; draft=clone(ev); draft.tasks ||= []; }
  else draft={id:uid(), title:"", type:(state.types.find(t=>!state.hidden.includes(t.key)&&!t.noPromo)||state.types[0]||{key:"etc"}).key, date:date||todayStr(), endDate:"", time:"", place:"", staff:"", grades:"", memo:"", tasks:[]};
  drawEditor(!id);
  $("#dlg").showModal();
  if(focusTask){ const c=document.querySelector(`.tcard[data-tid="${focusTask}"]`); if(c){ c.scrollIntoView({block:"center"}); c.classList.add("flash"); } }
  else if(!id) $("#f-title").focus();
}

  $("#dlgForm").innerHTML=`
  <header><h2>${isNew?"새 행사":"행사 수정"}</h2><button type="button" class="btn" data-close aria-label="닫기">닫기</button></header>
  <div class="scroll">
    <div class="f w4" style="margin-bottom:12px"><span>종류</span><div class="typepick">
      ${state.types.map(t=>`<label><input type="radio" name="type" value="${esc(t.key)}" ${e.type===t.key?"checked":""}><span style="background:${t.color};color:${inkFor(t.color)}">${esc(t.name)}</span></label>`).join("")}
      ${state.types.some(t=>t.key===e.type)?"":`<span style="font-size:12px;color:var(--muted);align-self:center">현재: 미분류 (종류를 골라 주세요)</span>`}
    </div></div>
    <div class="fgrid">
      <label class="f w2"><span>행사명 *</span><input id="f-title" data-e="title" value="${esc(e.title)}" placeholder="예: 11월 개강 설명회(중등)"></label>
      <label class="f"><span>날짜 *</span><input type="date" data-e="date" value="${esc(e.date)}"></label>
      <label class="f"><span>시간</span><input type="time" data-e="time" value="${esc(e.time)}"></label>
      <label class="f"><span>종료일(여러 날일 때)</span><input type="date" data-e="endDate" value="${esc(e.endDate)}"></label>
      <label class="f"><span>대상 학년</span><input data-e="grades" value="${esc(e.grades)}" placeholder="예: 중2, 중3"></label>
      <label class="f"><span>장소</span><input data-e="place" value="${esc(e.place)}" placeholder="예: 청담 별관 세미나실"></label>
      <div class="f w4"><span>담당자 (여러 명 선택 가능)</span>${staffPickHTML(e.staff)}</div>
      <label class="f w4"><span>메모</span><textarea data-e="memo" rows="2">${esc(e.memo)}</textarea></label>
    </div>
    <div class="tasksec">
      <div class="h"><h3>홍보·준비 할 일 (${e.tasks.length})</h3>
        <button type="button" class="btn small" id="tplBtn">기본 홍보 일정 채우기</button>
        <button type="button" class="btn small" id="addTask">+ 할 일 추가</button></div>
      <p class="hint">블로그 업로드 마감일, 문자·알림톡 발송(차수·대상·시각·문구), 본사 요청 등을 적어 두면 달력과 ‘할 일’에 함께 표시됩니다.</p>
      <div id="tasks">${e.tasks.map(taskCard).join("") || `<p class="hint">아직 없습니다. ‘기본 홍보 일정 채우기’를 누르면 행사 날짜 기준으로 자동 계산됩니다.</p>`}</div>
    </div>
  </div>
  <footer>
    <span class="info">${e.updatedBy?`마지막 수정: ${esc(e.updatedBy)} · ${new Date(e.updatedAt).toLocaleString("ko-KR")}`:""}</span>
    ${isNew?"":`<button type="button" class="btn danger" id="delBtn">삭제</button>`}
    <button type="button" class="btn" data-close>취소</button>
    <button type="button" class="btn primary" id="saveBtn">저장</button>
  </footer>`;
}
const splitNames = s => String(s||"").split(/[,，、]/).map(x=>x.trim()).filter(Boolean);
function staffPickHTML(str){
  const sel=splitNames(str); const names=[...staffList(), ...sel.filter(n=>!staffList().includes(n))];
  if(!names.length) return `<p class="hint" style="margin:4px 0">관리자 명단이 비어 있습니다. 위쪽 ‘관리자 명단’에서 먼저 등록해 주세요.</p>`;
  return `<div class="pick">${names.map(n=>`<button type="button" data-staff="${esc(n)}" aria-pressed="${sel.includes(n)}">${esc(n)}</button>`).join("")}</div>`;
}
function taskCard(t){
  const dd = draft.date && t.date ? diff(t.date, draft.date) : null;
  return `<div class="tcard ${t.channel}" data-tid="${t.id}">
    <label class="done">완료<input type="checkbox" data-f="done" ${t.done?"checked":""}></label>
    <label class="f"><span>채널</span><select data-f="channel">${Object.entries(CHANNELS).map(([k,c])=>`<option value="${k}" ${t.channel===k?"selected":""}>${c.name}</option>`).join("")}</select></label>
    <label class="f"><span>내용 (예: 1차 문구)</span><input data-f="label" value="${esc(t.label)}"></label>
    <label class="f"><span>날짜 ${dd!=null?`<b class="dday">${dd>0?`D-${dd}`:dd===0?"당일":`D+${-dd}`}</b>`:""}</span><input type="date" data-f="date" value="${esc(t.date)}"></label>
    <label class="f"><span>시각</span><input type="time" data-f="time" value="${esc(t.time)}"></label>
    <label class="f"><span>대상</span><select data-f="audience"><option value="">-</option>${AUDIENCES.map(a=>`<option ${t.audience===a?"selected":""}>${a}</option>`).join("")}</select></label>
    <label class="f"><span>학년</span><input data-f="grades" value="${esc(t.grades)}" placeholder="중1~중3"></label>
    <label class="f"><span>담당</span><select data-f="assignee"><option value="">-</option>${(t.assignee&&!staffList().includes(t.assignee)?[...staffList(),t.assignee]:staffList()).map(n=>`<option ${n===t.assignee?"selected":""}>${esc(n)}</option>`).join("")}</select></label>

    <label class="f content"><span>문구 / 링크 / 메모</span><textarea data-f="content" rows="1" placeholder="문자 문구나 블로그 링크를 적어 두세요">${esc(t.content)}</textarea></label>
  </div>`;
}

/* ---------- 이벤트 처리 ---------- */
async function toggleTask(evId, tId, done){
  const ev=state.events.find(e=>e.id===evId); if(!ev) return;
  const next=clone(ev);
  const t=next.tasks.find(x=>x.id===tId); if(!t) return;
  t.done=done; t.doneBy=done?(state.user||"이름없음"):"";
  try{ await store.save(next); }catch(err){ toast("저장하지 못했습니다: "+err.message); }
}

document.addEventListener("click", async e=>{
  const b=e.target.closest("button, [data-day], input[type=checkbox]");
  if(!b) return;
  if(b.dataset.view){ state.view=b.dataset.view; render(); return; }
  if(b.id==="allTypes"){ const all=state.types.every(t=>!state.hidden.includes(t.key)); state.hidden = all ? state.types.map(t=>t.key) : []; lsSet("acad-hiddenTypes",state.hidden); render(); return; }
  if(b.id==="editTypes"){ openTypeEditor(); return; }
  if(b.id==="editStaff"){ openStaffEditor(); return; }
  if(b.dataset.sel){ state.sel = state.sel===b.dataset.sel ? null : b.dataset.sel; render(); return; }
  if(b.id==="clearSel"){ state.sel=null; render(); return; }
  if(b.dataset.ymark){ openYMark(b.dataset.ymark); return; }
  if(b.dataset.gomonth){ const d=parse(b.dataset.gomonth); state.y=d.getFullYear(); state.m=d.getMonth(); state.view="cal"; render(); window.scrollTo({top:0}); return; }
  if(b.id==="printBtn"){ window.print(); return; }
  if(b.dataset.goto){ const d=parse(b.dataset.goto); state.y=d.getFullYear(); state.m=d.getMonth(); render(); return; }
  if(b.dataset.nav!=null){ const n=+b.dataset.nav; if(n===0){ state.y=now.getFullYear(); state.m=now.getMonth(); } else { const d=new Date(state.y,state.m+n,1); state.y=d.getFullYear(); state.m=d.getMonth(); } render(); return; }
  if(b.dataset.toggle){ const [a,c]=b.dataset.toggle.split("|"); toggleTask(a,c,b.checked); return; }
  if(b.dataset.copy){ const [a,c]=b.dataset.copy.split("|"); const t=state.events.find(x=>x.id===a)?.tasks.find(x=>x.id===c);
    try{ await navigator.clipboard.writeText(t?.content||""); toast("문구를 복사했습니다."); }catch{ toast("복사하지 못했습니다. 열기에서 직접 선택해 주세요."); } return; }
  if(b.dataset.ev && !b.closest("dialog")){ e.stopPropagation(); openEditor(b.dataset.ev,null,b.dataset.task); return; }
  if(b.dataset.day && e.target.closest(".body,.dh") && !e.target.closest("button")){ openEditor(null,b.dataset.day); return; }
});
$("#addBtn").onclick=()=>openEditor(null, state.view==="cal" && (state.y!==now.getFullYear()||state.m!==now.getMonth()) ? `${state.y}-${pad(state.m+1)}-01` : todayStr());
$("#whoBtn").onclick=openUserPicker;

/* 행사에 마우스를 올리면 그 행사의 홍보 일정만 밝게 */
let curFocus=null;
function setFocus(id){
  const cal=document.querySelector(".cal"); if(!cal) return;
  cal.querySelectorAll(".hl").forEach(x=>x.classList.remove("hl"));
  cal.querySelectorAll(".hlday").forEach(x=>x.classList.remove("hlday"));
  if(!id){ cal.classList.remove("focus"); return; }
  const els=cal.querySelectorAll(`[data-ev="${CSS.escape(id)}"]`);
  if(!els.length){ cal.classList.remove("focus"); return; }
  cal.classList.add("focus");
  els.forEach(x=>{ x.classList.add("hl"); x.closest(".day")?.classList.add("hlday");
    const st=x.nextElementSibling; if(st?.classList.contains("staff")) st.classList.add("hl"); });
}
function focusFrom(target){
  if(state.sel){ if(curFocus){ curFocus=null; setFocus(null); } return; }
  const c=target.closest?.(".cal [data-ev], [data-hev]");
  const id=c ? (c.dataset.ev||c.dataset.hev) : null;
  if(id!==curFocus){ curFocus=id; setFocus(id); }
}
document.addEventListener("mouseover",e=>focusFrom(e.target));
document.addEventListener("focusin",e=>focusFrom(e.target));
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && state.sel && !document.querySelector("dialog[open]")){ state.sel=null; render(); } });
$("#homeBtn").onclick=()=>{ state.sel=null; state.view="cal"; state.y=new Date().getFullYear(); state.m=new Date().getMonth(); render(); window.scrollTo({top:0,behavior:"smooth"}); };

document.addEventListener("change", e=>{
  const el=e.target;
  if(el.dataset.legend){ const k=el.dataset.legend; state.hidden = el.checked ? state.hidden.filter(x=>x!==k) : [...state.hidden,k]; lsSet("acad-hiddenTypes",state.hidden); render(); }
  else if(el.id==="showTasks"){ state.showTasks=el.checked; lsSet("acad-showTasks",el.checked); render(); }
  else if(el.id==="whoSel"){ state.who=el.value; lsSet("acad-who",state.who); render(); }
  else if(el.id==="yySel"){ state.yy=+el.value; render(); }
  else if(el.dataset.ynote){ const [y,m]=el.dataset.ynote.split("-").map(Number); const v=el.value;
    saveYm(y,m-1,doc=>{ doc.note=v; }).then(ok=>{ if(ok) toast(`${m}월 메모를 저장했습니다.`); }); }
  else if(el.id==="ySel"){ state.y=+el.value; render(); }
  else if(el.id==="mSel"){ state.m=+el.value; render(); }
  else if(el.id==="period"){ state.period=el.value; render(); }
});
document.addEventListener("input", e=>{

});

/* 편집 창 안 */
const form=$("#dlgForm");
form.addEventListener("input", e=>{
  const el=e.target;
  if(el.dataset.e){ draft[el.dataset.e]=el.value; return; }
  const card=el.closest("[data-tid]");
  if(card && el.dataset.f){ autoFilled=false; const t=draft.tasks.find(x=>x.id===card.dataset.tid); t[el.dataset.f]= el.type==="checkbox"?el.checked:el.value;
    if(el.dataset.f==="done") t.doneBy=el.checked?(state.user||"이름없음"):"";
    if(el.dataset.f==="channel") card.className=`tcard ${el.value}`; }
});
form.addEventListener("change", e=>{
  const el=e.target;
  if(el.name==="type"){ draft.type=el.value;
    if(typeOf(draft.type).noPromo){ if(autoFilled && draft.tasks.length){ draft.tasks=[]; autoFilled=false; redraw(); } }
    else if(!draft.tasks.length && draft.date){ draft.tasks=buildTasks(draft.type,draft.date); autoFilled=true; redraw(); toast(`기본 홍보 일정(블로그·문자) ${draft.tasks.length}개를 채웠습니다. 날짜를 확인해 주세요.`); } }
  if(el.dataset.f==="date" || el.dataset.e==="date") redraw();
});
form.addEventListener("click", async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-close")){ $("#dlg").close(); return; }
  if(b.dataset.staff!=null){ const n=b.dataset.staff; let sel=splitNames(draft.staff);
    sel = sel.includes(n) ? sel.filter(x=>x!==n) : [...sel,n];
    draft.staff = staffList().filter(x=>sel.includes(x)).concat(sel.filter(x=>!staffList().includes(x))).join(", ");
    b.setAttribute("aria-pressed", sel.includes(n)); return; }
  if(b.id==="addTask"){ autoFilled=false; draft.tasks.push({id:uid(),channel:"sms",label:"",date:draft.date?addDays(draft.date,-7):todayStr(),time:"18:00",audience:"",grades:"",assignee:"",content:"",done:false,doneBy:""}); redraw(); return; }
  if(b.hasAttribute("data-deltask")){ autoFilled=false; const id=b.closest("[data-tid]").dataset.tid; draft.tasks=draft.tasks.filter(t=>t.id!==id); redraw(); return; }
  if(b.id==="tplBtn"){
    if(typeOf(draft.type).noPromo){ toast(`${typeOf(draft.type).name}에는 기본 홍보 일정을 채우지 않습니다. 필요하면 ‘+ 할 일 추가’를 눌러 주세요.`); return; }
    if(!draft.date){ toast("행사 날짜를 먼저 입력해 주세요."); return; }
    if(draft.tasks.length && !confirm("지금 할 일 목록을 지우고 기본 홍보 일정으로 바꿀까요?")) return;
    draft.tasks=buildTasks(draft.type,draft.date); autoFilled=true; redraw(); return;
  }
  if(b.id==="delBtn"){ if(!confirm(`‘${draft.title}’ 행사를 삭제할까요? 홍보 할 일도 함께 삭제됩니다.`)) return;
    try{ await store.remove(draft.id); $("#dlg").close(); toast("삭제했습니다."); }catch(err){ toast("삭제하지 못했습니다: "+err.message); } return; }
  if(b.id==="saveBtn"){
    if(!draft.title.trim()){ toast("행사명을 입력해 주세요."); $("#f-title").focus(); return; }
    if(!draft.date){ toast("날짜를 입력해 주세요."); return; }
    if(draft.endDate && draft.endDate<draft.date){ toast("종료일이 시작일보다 빠릅니다."); return; }
    if(!state.user){ openUserPicker(); toast("먼저 사용자를 선택한 뒤 다시 저장해 주세요."); return; }
    draft.title=draft.title.trim(); draft.updatedBy=state.user||"이름없음"; draft.updatedAt=Date.now(); sortTasks(draft.tasks);
    b.disabled=true;
    try{ await store.save(clone(draft)); $("#dlg").close(); toast("저장했습니다."); }
    catch(err){ toast("저장하지 못했습니다: "+err.message); b.disabled=false; }
  }
});
function redraw(){ const sc=form.querySelector(".scroll")?.scrollTop||0; const isNew=!state.events.some(e=>e.id===draft.id); drawEditor(isNew); form.querySelector(".scroll").scrollTop=sc; }

}
const tForm=$("#tForm");
tForm.addEventListener("input",e=>{ const r=e.target.closest("[data-ti]"); const f=e.target.dataset.tf; if(!r||!f) return;
  if(f==="promo") tdraft[+r.dataset.ti].noPromo=!e.target.checked; else tdraft[+r.dataset.ti][f]=e.target.value; });
tForm.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  if(b.hasAttribute("data-tclose")){ $("#tdlg").close(); return; }
  if(b.id==="tAdd"){ const used=tdraft.map(t=>t.color.toUpperCase()); tdraft.push({key:"t"+uid(), name:"", color:PALETTE.find(c=>!used.includes(c))||"#D9DEE5"}); drawTypeEditor(); tForm.querySelector(`[data-ti="${tdraft.length-1}"] input[type=text]`).focus(); return; }
  if(b.dataset.tdel!=null){ const i=+b.dataset.tdel, t=tdraft[i], n=state.events.filter(x=>x.type===t.key).length;
    if(n && !confirm(`‘${t.name}’으로 등록된 행사 ${n}개는 ‘미분류’(회색)로 남습니다. 삭제할까요?`)) return;
    tdraft.splice(i,1); drawTypeEditor(); return; }
  if(b.id==="tSave"){
    const names=tdraft.map(t=>t.name.trim());
    if(names.some(n=>!n)){ toast("이름이 비어 있는 종류가 있습니다."); return; }

    tdraft.forEach(t=>t.name=t.name.trim());
    try{ await store.save({...cfgBase(), id:"_config", types:clone(tdraft), updatedBy:state.user||"이름없음", updatedAt:Date.now()}); $("#tdlg").close(); toast("메뉴를 저장했습니다."); }
    catch(err){ toast("저장하지 못했습니다: "+err.message); }
  }
});

/* ---------- 시작 ---------- */
(async function start(){
  const st=$("#status");
  if(DEMO){
    store=makeLocalStore();
    st.className="status demo"; st.textContent="데모 모드";
    $("#banner").innerHTML=`<div class="banner">지금은 데모 모드라 이 브라우저에만 저장됩니다. 파일 상단의 firebaseConfig 에 Firebase 정보를 넣으면 팀 전체가 같은 일정을 실시간으로 함께 씁니다. 예시 일정은 업로드해 주신 표에서 가져왔습니다.</div>`;
  } else {
    try{ store=await makeFirebaseStore(); st.className="status ok"; st.textContent="실시간 공유 중"; }
    catch(err){
      st.className="status err"; st.textContent="연결 실패";
      const hint = /admin-restricted|operation-not-allowed/.test(err.code||err.message) ? "Firebase 콘솔 > Authentication > 로그인 방법에서 ‘익명’을 사용 설정해 주세요." : "firebaseConfig 값과 인터넷 연결을 확인해 주세요.";
      $("#banner").innerHTML=`<div class="banner err">Firebase에 연결하지 못했습니다. ${hint} (${esc(err.code||err.message)})</div>`;
      render(); return;
    }
  }
  let first=true;
  store.subscribe(docs=>{
    const cfg=docs.find(d=>d.id==="_config");
    state.types = cfg?.types?.length ? cfg.types : DEFAULT_TYPES;
    if(cfg && !cfg.v2){
      const types=clone(cfg.types||[]);
      for(const d of ADDED_V2){
        const same=types.find(t=>t.name.replace(/\s/g,"")===d.name);
        if(same) same.noPromo=true; else types.push(clone(d));
      }
      store.save({...cfg, types, v2:true}).catch(()=>{});
    }
    state.cfg = cfg || null;
    state.ym = Object.fromEntries(docs.filter(d=>d.id.startsWith("_ym_")).map(d=>[d.id,d]));
    state.events = docs.filter(d=>!d.id.startsWith("_"));
    if(state.sel && !state.events.some(e=>e.id===state.sel)) state.sel=null;
    const ae=document.activeElement;
    if(ae && ae.matches && ae.matches(".ynote")){ pendingRender=true; }
    else render();
    if(first){ first=false; if(!state.user) openUserPicker(); }
    else if($("#udlg").open) openUserPicker();
  }, err=>{
    st.className="status err"; st.textContent="권한 오류";
    $("#banner").innerHTML=`<div class="banner err">일정을 불러오지 못했습니다. Firestore 보안 규칙을 확인해 주세요. (${esc(err.code||err.message)})</div>`;
  });
  render();
})();
</script>
